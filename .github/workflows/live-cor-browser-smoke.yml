name: Live COR Browser Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/live-cor-browser-smoke.yml"
      - "scripts/verify-browser-cor-shopper.mjs"
      - "src/integration/cor-shopper-demo-credential-provider.ts"
      - "src/integration/cor-shopper-remote-client.ts"

permissions:
  contents: read

concurrency:
  group: live-cor-browser-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Live COR smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
          - browser: webkit
    env:
      PAGES_URL: https://mohamad-haghi.github.io/noor-personal-shopper/
      COR_SHOPPER_BASE_URL: https://cor-noor-test.onrender.com
      NOOR_BROWSER_ENGINE: ${{ matrix.browser }}
    steps:
      - name: Checkout NOOR
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install browser
        run: npx playwright install --with-deps "${{ matrix.browser }}"

      - name: Test live credential, recommendation API, and published UI
        run: node scripts/verify-browser-cor-shopper.mjs
