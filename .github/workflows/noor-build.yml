name: NOOR Build Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      run_live_ui:
        description: "Run the live NOOR/COR browser proof"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NOOR
        uses: actions/checkout@v4

      - name: Checkout Digital Sales Core
        uses: actions/checkout@v4
        with:
          repository: Mohamad-haghi/digital-sales-core
          path: digital-sales-core
          token: ${{ secrets.CORE_REPO_TOKEN }}
          ref: 54065f21cc9134bd6de6196aa5f4b41a9ec3fd0e

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm pkg set dependencies.digital-sales-core="file:./digital-sales-core"
          npm install --package-lock=false --no-audit --no-fund

      - name: Run behavioral tests
        run: npm test

      - name: Type-check and build
        run: npm run build

  live-ui-comparison-handoff:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_ui
    name: Live NOOR UI comparison and COR handoff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout NOOR browser proof
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated Playwright dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/noor-playwright" playwright@1.56.1 --no-audit --no-fund
          ln -s "$RUNNER_TEMP/noor-playwright/node_modules" node_modules
      - name: Install Chromium
        run: |
          "$RUNNER_TEMP/noor-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise live deployed NOOR comparison and product handoff UI
        env:
          PAGES_URL: https://mohamad-haghi.github.io/noor-personal-shopper/
          COR_SHOPPER_BASE_URL: https://digital-sales-core.onrender.com
          EVIDENCE_PATH: artifacts/noor-ui-comparison-handoff.json
        run: node scripts/verify-live-ui-comparison-handoff.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noor-live-ui-comparison-handoff
          path: artifacts/noor-ui-comparison-handoff.json
          if-no-files-found: warn
