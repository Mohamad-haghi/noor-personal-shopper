name: NOOR Build Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure private Core dependency access
        run: |
          git config --global url."https://x-access-token:${CORE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${CORE_REPO_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://x-access-token:${CORE_REPO_TOKEN}@github.com/".insteadOf "git@github.com:"
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Run behavioral tests
        run: npm test

      - name: Type-check and build
        run: npm run build
