name: NOOR Build Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global credential.helper store
          printf '%s\n' "https://x-access-token:${CORE_REPO_TOKEN}@github.com" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          echo "Checking PAT authentication..."
          curl -sS -o /tmp/token-check.json -w "GitHub token HTTP %{http_code}\n" -H "Authorization: Bearer ${CORE_REPO_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/user
          echo "Checking Core repository access..."
          curl -sS -o /tmp/core-check.json -w "Core repository HTTP %{http_code}\n" -H "Authorization: Bearer ${CORE_REPO_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/Mohamad-haghi/digital-sales-core
          git ls-remote "https://x-access-token:${CORE_REPO_TOKEN}@github.com/Mohamad-haghi/digital-sales-core.git" HEAD
          npm install

      - name: Run behavioral tests
        run: npm test

      - name: Type-check and build
        run: npm run build
