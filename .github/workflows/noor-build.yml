name: NOOR Build Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NOOR
        uses: actions/checkout@v4

      - name: Checkout Digital Sales Core
        uses: actions/checkout@v4
        with:
          repository: Mohamad-haghi/digital-sales-core
          path: digital-sales-core
          token: ${{ secrets.CORE_REPO_TOKEN }}
          ref: d306c5efee32707362ac2ee449ef85f95cd876a5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm pkg set dependencies.digital-sales-core="file:./digital-sales-core"
          npm install --package-lock=false --no-audit --no-fund

      - name: Run behavioral tests
        run: npm test

      - name: Type-check and build
        run: npm run build
