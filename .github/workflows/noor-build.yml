name: NOOR Build Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      live_cor_smoke:
        description: "Run the live Chromium COR browser smoke"
        type: boolean
        required: false
        default: false
      live_cor_webkit:
        description: "Also run the live WebKit COR browser smoke (extra CI time)"
        type: boolean
        required: false
        default: false

# Chromium live checks are opt-in: PR title marker [live-cor-smoke] or workflow_dispatch input live_cor_smoke=true.
# WebKit is separately opt-in on manual dispatch to avoid blocking the primary Chromium gate on system package installation.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout NOOR
        uses: actions/checkout@v4

      - name: Checkout Digital Sales Core
        uses: actions/checkout@v4
        with:
          repository: Mohamad-haghi/digital-sales-core
          path: digital-sales-core
          token: ${{ secrets.CORE_REPO_TOKEN }}
          ref: 54065f21cc9134bd6de6196aa5f4b41a9ec3fd0e

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm pkg set dependencies.digital-sales-core="file:./digital-sales-core"
          npm install --package-lock=false --no-audit --no-fund

      - name: Run behavioral tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Install Chromium for live COR browser smoke
        if: (github.event_name == 'workflow_dispatch' && inputs.live_cor_smoke) || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[live-cor-smoke]'))
        timeout-minutes: 3
        run: npx playwright install chromium

      - name: Run live COR browser smoke (Chromium)
        if: (github.event_name == 'workflow_dispatch' && inputs.live_cor_smoke) || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[live-cor-smoke]'))
        env:
          PAGES_URL: https://mohamad-haghi.github.io/noor-personal-shopper/
          COR_SHOPPER_BASE_URL: https://cor-noor-test.onrender.com
          NOOR_BROWSER_ENGINE: chromium
        run: node scripts/verify-browser-cor-shopper.mjs

      - name: Install WebKit system dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.live_cor_smoke && inputs.live_cor_webkit
        timeout-minutes: 5
        run: npx playwright install-deps webkit

      - name: Install WebKit for live COR browser smoke
        if: github.event_name == 'workflow_dispatch' && inputs.live_cor_smoke && inputs.live_cor_webkit
        timeout-minutes: 3
        run: npx playwright install webkit

      - name: Run live COR browser smoke (WebKit)
        if: github.event_name == 'workflow_dispatch' && inputs.live_cor_smoke && inputs.live_cor_webkit
        env:
          PAGES_URL: https://mohamad-haghi.github.io/noor-personal-shopper/
          COR_SHOPPER_BASE_URL: https://cor-noor-test.onrender.com
          NOOR_BROWSER_ENGINE: webkit
        run: node scripts/verify-browser-cor-shopper.mjs
