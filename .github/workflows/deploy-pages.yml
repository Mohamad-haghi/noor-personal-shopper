name: Deploy NOOR Personal Shopper to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NOOR
        uses: actions/checkout@v6

      - name: Checkout Digital Sales Core
        uses: actions/checkout@v6
        with:
          repository: Mohamad-haghi/digital-sales-core
          path: digital-sales-core
          token: ${{ secrets.CORE_REPO_TOKEN }}
          ref: ad965af6ebd8889f084b00755db3b5fed16904c2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm pkg set dependencies.digital-sales-core="file:./digital-sales-core"
          npm install

      - name: Verify behavior
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
