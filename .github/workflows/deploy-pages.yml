name: Deploy NOOR Personal Shopper to GitHub Pages
# Re-run Pages deployment after the same-origin credential redirect fix.
# Publish the Safari-compatible header-free demo-session request.
# Publish explicit browser CORS-versus-network diagnostics.
# Publish distinct reachability-probe failure diagnostics.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Bump the group to release a stale run blocked in the old apt-based browser install.
  group: github-pages-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NOOR
        uses: actions/checkout@v6
      - name: Checkout pinned Digital Sales Core dependency
        uses: actions/checkout@v6
        with:
          repository: Mohamad-haghi/digital-sales-core
          path: digital-sales-core
          token: ${{ secrets.CORE_REPO_TOKEN }}
          ref: 14d6dfae81907a89a802731ab69de9f5bfd8cdab
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm pkg set dependencies.digital-sales-core="file:./digital-sales-core"
          npm install
      - name: Verify behavior
        run: npm test
      - name: Build production bundle with live COR Shopper
        env:
          VITE_NOOR_MODE: integrated
          VITE_COR_SHOPPER_BASE_URL: https://digital-sales-core.onrender.com
        run: npm run build
      - name: Verify COR origin is embedded in production bundle
        run: |
          set -euo pipefail
          grep -R -F --quiet 'digital-sales-core.onrender.com' dist/assets
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout NOOR for browser smoke test
        uses: actions/checkout@v6
      - name: Checkout pinned Digital Sales Core dependency
        uses: actions/checkout@v6
        with:
          repository: Mohamad-haghi/digital-sales-core
          path: digital-sales-core
          token: ${{ secrets.CORE_REPO_TOKEN }}
          ref: 14d6dfae81907a89a802731ab69de9f5bfd8cdab
      - name: Setup Node.js for browser smoke test
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # Publish the verified build before installing optional browser-test engines.
      # If browser downloads are slow, the diagnostic UI still reaches the live demo.
      - name: Verify deployed demo catalog feed over HTTPS
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          case "$PAGES_URL" in
            "https://mohamad-haghi.github.io/noor-personal-shopper/" ) ;;
            * ) echo "Unexpected Pages origin/path"; exit 1 ;;
          esac
          feed_url="${PAGES_URL}catalog-feed.json"
          feed_file="$RUNNER_TEMP/catalog-feed.json"
          curl --fail --silent --show-error --max-time 20 --max-filesize 1048576 --retry 8 --retry-delay 5 --retry-all-errors "$feed_url" --output "$feed_file"
          node --input-type=module - "$feed_file" "$feed_url" <<'NODE'
          import { readFile } from "node:fs/promises";
          const [file, url] = process.argv.slice(2);
          const raw = await readFile(file, "utf8");
          const feed = JSON.parse(raw);
          if (!feed || feed.contractVersion !== "1.0.0" || feed.source !== "noor-demo" || feed.demoOnly !== true || feed.catalogSize !== 15 || !Array.isArray(feed.products) || feed.products.length !== 15) throw new Error("published_catalog_feed_contract_invalid");
          const ids = new Set();
          for (const p of feed.products) {
            if (!p || typeof p.id !== "string" || !p.id.trim() || ids.has(p.id) || typeof p.name !== "string" || p.price !== null || p.availability !== true || p.availabilityStatus !== "available_demo" || p.availabilitySource !== "demo" || !Array.isArray(p.images)) throw new Error("published_catalog_feed_product_invalid");
            ids.add(p.id);
          }
          console.log(JSON.stringify({status:"verified",url,productCount:feed.products.length,demoOnly:feed.demoOnly},null,2));
          NODE
      - name: Verify live COR Shopper session and recommendation API
        env:
          COR_SHOPPER_BASE_URL: https://digital-sales-core.onrender.com
          PAGES_ORIGIN: https://mohamad-haghi.github.io
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.COR_SHOPPER_BASE_URL;
          const origin = process.env.PAGES_ORIGIN;
          const preflightResponse = await fetch(new URL("/shopper/v1/recommendations", base), {
            method: "OPTIONS",
            headers: {
              Origin: origin,
              "Access-Control-Request-Method": "POST",
              "Access-Control-Request-Headers": "authorization,content-type"
            },
            signal: AbortSignal.timeout(90000)
          });
          const preflightOrigin = preflightResponse.headers.get("access-control-allow-origin");
          const preflightMethods = preflightResponse.headers.get("access-control-allow-methods") ?? "";
          const preflightHeaders = preflightResponse.headers.get("access-control-allow-headers") ?? "";
          console.log(JSON.stringify({
            diagnostic: "cor_browser_cors_preflight",
            httpStatus: preflightResponse.status,
            allowOriginMatches: preflightOrigin === origin,
            allowsPost: preflightMethods.split(",").map(value => value.trim().toUpperCase()).includes("POST"),
            allowsAuthorization: preflightHeaders.toLowerCase().split(",").map(value => value.trim()).includes("authorization"),
            allowsContentType: preflightHeaders.toLowerCase().split(",").map(value => value.trim()).includes("content-type")
          }));
          if (preflightResponse.status !== 204 || preflightOrigin !== origin ||
              !preflightMethods.split(",").map(value => value.trim().toUpperCase()).includes("POST") ||
              !preflightHeaders.toLowerCase().split(",").map(value => value.trim()).includes("authorization") ||
              !preflightHeaders.toLowerCase().split(",").map(value => value.trim()).includes("content-type")) {
            throw new Error("live_cor_browser_cors_preflight_failed");
          }

          const sessionResponse = await fetch(new URL("/shopper/v1/demo-session", base), {
            headers: { Origin: origin },
            signal: AbortSignal.timeout(90000)
          });
          const sessionBody = await sessionResponse.json().catch(() => ({}));
          if (sessionResponse.headers.get("access-control-allow-origin") !== origin) {
            throw new Error("live_cor_demo_session_cors_header_missing");
          }
          if (!sessionResponse.ok || sessionBody.contractVersion !== "1.0.0" ||
              sessionBody.demoOnly !== true || sessionBody.credentialType !== "short_lived_demo_bearer" ||
              typeof sessionBody.credential !== "string" || !sessionBody.credential) {
            throw new Error("live_cor_demo_session_failed: HTTP " + sessionResponse.status + " / " + (sessionBody.error ?? "invalid_response"));
          }
          // Diagnostic control: same category and installation, but no optional preferences.
          // This distinguishes a preference/mapping interaction from an empty eligible catalog.
          const baselineResponse = await fetch(new URL("/shopper/v1/recommendations", base), {
            method: "POST",
            headers: {
              Origin: origin,
              Authorization: "Bearer " + sessionBody.credential,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              contractVersion: "1.0.0",
              requestId: "pages-live-smoke-baseline",
              sessionId: "noor-demo-smoke",
              intent: {
                category: "sunglasses",
                preferences: {},
                constraints: {},
                priorities: [],
                desiredAttributes: [],
                excludedAttributes: []
              },
              limit: 3
            }),
            signal: AbortSignal.timeout(90000)
          });
          const baselineBody = await baselineResponse.json().catch(() => ({}));
          console.log(JSON.stringify({
            diagnostic: "cor_recommendation_baseline_without_preferences",
            httpStatus: baselineResponse.status,
            contractVersion: baselineBody.contractVersion ?? null,
            requestIdMatches: baselineBody.requestId === "pages-live-smoke-baseline",
            source: baselineBody.result?.source ?? null,
            demoOnly: baselineBody.result?.demoOnly ?? null,
            recommendationCount: Array.isArray(baselineBody.result?.recommendations)
              ? baselineBody.result.recommendations.length : null,
            recommendationSummaries: Array.isArray(baselineBody.result?.recommendations)
              ? baselineBody.result.recommendations.map(item => ({
                  productId: item?.productId ?? null,
                  score: item?.score ?? null,
                  matchedCriteria: Array.isArray(item?.matchedCriteria) ? item.matchedCriteria : []
                })) : null,
            error: baselineBody.error ?? null
          }));
          if (!baselineResponse.ok || baselineBody.contractVersion !== "1.0.0" ||
              baselineBody.requestId !== "pages-live-smoke-baseline" ||
              baselineBody.result?.source !== "cor_canonical_engine" ||
              baselineBody.result?.demoOnly !== true ||
              !Array.isArray(baselineBody.result?.recommendations)) {
            throw new Error("live_cor_recommendation_baseline_failed: HTTP " + baselineResponse.status);
          }

          const recommendationResponse = await fetch(new URL("/shopper/v1/recommendations", base), {
            method: "POST",
            headers: {
              Origin: origin,
              Authorization: "Bearer " + sessionBody.credential,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              contractVersion: "1.0.0",
              requestId: "noor-test-pages-live-smoke",
              sessionId: "noor-demo-smoke",
              intent: {
                category: "sunglasses",
                // Isolated staging installation 708 uses Domain Pack 1.2.0; retain compatible shape keys.
                // Keep modern keys too for compatibility with the newer Domain Pack contract.
                preferences: { shape: "aviator", frameShapes: "aviator", faceCompatibility: "oval" },
                constraints: {},
                priorities: [],
                desiredAttributes: [],
                excludedAttributes: []
              },
              limit: 3
            }),
            signal: AbortSignal.timeout(90000)
          });
          const recommendationBody = await recommendationResponse.json().catch(() => ({}));
          if (recommendationResponse.headers.get("access-control-allow-origin") !== origin) {
            throw new Error("live_cor_recommendations_cors_header_missing");
          }
          console.log(JSON.stringify({
            diagnostic: "cor_recommendation_response",
            httpStatus: recommendationResponse.status,
            contractVersion: recommendationBody.contractVersion ?? null,
            requestIdMatches: recommendationBody.requestId === "noor-test-pages-live-smoke",
            resultKeys: recommendationBody.result && typeof recommendationBody.result === "object"
              ? Object.keys(recommendationBody.result) : [],
            source: recommendationBody.result?.source ?? null,
            demoOnly: recommendationBody.result?.demoOnly ?? null,
            recommendationsType: Array.isArray(recommendationBody.result?.recommendations)
              ? "array" : typeof recommendationBody.result?.recommendations,
            recommendationCount: Array.isArray(recommendationBody.result?.recommendations)
              ? recommendationBody.result.recommendations.length : null,
            recommendationSummaries: Array.isArray(recommendationBody.result?.recommendations)
              ? recommendationBody.result.recommendations.map(item => ({
                  productId: item?.productId ?? null,
                  score: item?.score ?? null,
                  matchedCriteria: Array.isArray(item?.matchedCriteria) ? item.matchedCriteria : []
                })) : null
          }));
          if (!recommendationResponse.ok || recommendationBody.contractVersion !== "1.0.0" ||
              recommendationBody.requestId !== "noor-test-pages-live-smoke" ||
              recommendationBody.result?.source !== "cor_canonical_engine" ||
              recommendationBody.result?.demoOnly !== true ||
              !Array.isArray(recommendationBody.result?.recommendations) ||
              recommendationBody.result.recommendations.length === 0) {
            const result = recommendationBody.result;
            const diagnostic = {
              contractVersion: recommendationBody.contractVersion ?? null,
              requestIdMatches: recommendationBody.requestId === "noor-test-pages-live-smoke",
              resultSource: result?.source ?? null,
              demoOnly: result?.demoOnly ?? null,
              recommendationsType: Array.isArray(result?.recommendations) ? "array" : typeof result?.recommendations,
              recommendationCount: Array.isArray(result?.recommendations) ? result.recommendations.length : null,
              error: recommendationBody.error ?? null
            };
            console.error("Live COR recommendation response diagnostic:", JSON.stringify(diagnostic));
            throw new Error("live_cor_recommendations_failed: HTTP " + recommendationResponse.status);
          }

          const { readFile } = await import("node:fs/promises");
          const feed = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/catalog-feed.json`, "utf8"));
          const feedIds = new Set(feed.products.map((product) => product.id));
          if (recommendationBody.result.recommendations.some((item) => !feedIds.has(item.productId))) {
            throw new Error("live_cor_recommendation_product_id_not_in_feed");
          }

          // Differential test: keep frame shape fixed and change only face compatibility.
          // The seed catalog deliberately has aviator products with different face-compatibility sets.
          const faceTriangleResponse = await fetch(new URL("/shopper/v1/recommendations", base), {
            method: "POST",
            headers: {
              Origin: origin,
              Authorization: "Bearer " + sessionBody.credential,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              contractVersion: "1.0.0",
              requestId: "noor-test-pages-live-face-triangle",
              sessionId: "noor-demo-smoke",
              intent: {
                category: "sunglasses",
                preferences: { shape: "aviator", frameShapes: "aviator", faceCompatibility: "triangle" },
                constraints: {},
                priorities: [],
                desiredAttributes: [],
                excludedAttributes: []
              },
              limit: 3
            }),
            signal: AbortSignal.timeout(90000)
          });
          const faceTriangleBody = await faceTriangleResponse.json().catch(() => ({}));
          console.log(JSON.stringify({
            diagnostic: "cor_recommendation_face_compatibility_differential",
            httpStatus: faceTriangleResponse.status,
            requestIdMatches: faceTriangleBody.requestId === "noor-test-pages-live-face-triangle",
            source: faceTriangleBody.result?.source ?? null,
            demoOnly: faceTriangleBody.result?.demoOnly ?? null,
            recommendationSummaries: Array.isArray(faceTriangleBody.result?.recommendations)
              ? faceTriangleBody.result.recommendations.map(item => ({
                  productId: item?.productId ?? null,
                  score: item?.score ?? null,
                  matchedCriteria: Array.isArray(item?.matchedCriteria) ? item.matchedCriteria : []
                })) : null,
            error: faceTriangleBody.error ?? null
          }));
          if (!faceTriangleResponse.ok || faceTriangleBody.contractVersion !== "1.0.0" ||
              faceTriangleBody.requestId !== "noor-test-pages-live-face-triangle" ||
              faceTriangleBody.result?.source !== "cor_canonical_engine" ||
              faceTriangleBody.result?.demoOnly !== true ||
              !Array.isArray(faceTriangleBody.result?.recommendations) ||
              faceTriangleBody.result.recommendations.length === 0 ||
              faceTriangleBody.result.recommendations.some(item => !feedIds.has(item.productId))) {
            throw new Error("live_cor_recommendation_face_compatibility_differential_failed: HTTP " + faceTriangleResponse.status);
          }

          // Controlled ranking checks: change category/shape/face while keeping the session and installation fixed.
          // These requests are opt-in trace runs and never alter ranking configuration.
          const controlledScenarios = [
            {
              requestId: "noor-test-pages-square-round",
              category: "sunglasses",
              shape: "square",
              faceCompatibility: "round",
              expectedFirstProductId: "noor-demo-007-dior-30montaigne-epz-1i",
              expectedScores: [1, 1, 0.5]
            },
            {
              requestId: "noor-test-pages-optical-square-round",
              category: "optical",
              shape: "square",
              faceCompatibility: "round",
              expectedFirstProductId: "noor-demo-011-tom-ford-ft5661-001",
              expectedScores: [1, 1, 0.625]
            }
          ];
          for (const scenario of controlledScenarios) {
            const response = await fetch(new URL("/shopper/v1/recommendations", base), {
              method: "POST",
              headers: {
                Origin: origin,
                Authorization: "Bearer " + sessionBody.credential,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                contractVersion: "1.0.0",
                requestId: scenario.requestId,
                sessionId: "noor-demo-smoke",
                intent: {
                  category: scenario.category,
                  preferences: {
                    shape: scenario.shape,
                    frameShapes: scenario.shape,
                    faceCompatibility: scenario.faceCompatibility
                  },
                  constraints: {},
                  priorities: [],
                  desiredAttributes: [],
                  excludedAttributes: []
                },
                limit: 3
              }),
              signal: AbortSignal.timeout(90000)
            });
            const body = await response.json().catch(() => ({}));
            const recommendations = body.result?.recommendations;
            const actualScores = Array.isArray(recommendations)
              ? recommendations.map(item => item?.score ?? null) : null;
            const scoreMismatch = !Array.isArray(actualScores) ||
              actualScores.length !== scenario.expectedScores.length ||
              actualScores.some((score, index) =>
                typeof score !== "number" || Math.abs(score - scenario.expectedScores[index]) > 1e-9
              );
            console.log(JSON.stringify({
              diagnostic: "cor_controlled_recommendation_scenario",
              requestId: scenario.requestId,
              category: scenario.category,
              shape: scenario.shape,
              faceCompatibility: scenario.faceCompatibility,
              httpStatus: response.status,
              source: body.result?.source ?? null,
              demoOnly: body.result?.demoOnly ?? null,
              recommendationIds: Array.isArray(recommendations) ? recommendations.map(item => item?.productId ?? null) : null,
              scores: actualScores,
              expectedScores: scenario.expectedScores,
              scoreMismatch,
              error: body.error ?? null
            }));
            if (!response.ok || body.contractVersion !== "1.0.0" ||
                body.requestId !== scenario.requestId ||
                body.result?.source !== "cor_canonical_engine" ||
                body.result?.demoOnly !== true ||
                !Array.isArray(recommendations) || recommendations.length !== scenario.expectedScores.length ||
                recommendations[0]?.productId !== scenario.expectedFirstProductId ||
                scoreMismatch) {
              throw new Error("live_cor_controlled_recommendation_scenario_failed: " + scenario.requestId);
            }
          }

          const comparisonResponse = await fetch(new URL("/shopper/v1/comparisons", base), {
            method: "POST",
            headers: {
              Origin: origin,
              Authorization: "Bearer " + sessionBody.credential,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              contractVersion: "1.0.0",
              requestId: "pages-live-comparison-smoke",
              sessionId: "noor-demo-smoke",
              productIds: feed.products.slice(0, 2).map((product) => product.id),
              attributes: ["frame", "shape"]
            }),
            signal: AbortSignal.timeout(90000)
          });
          const comparisonBody = await comparisonResponse.json().catch(() => ({}));
          if (comparisonResponse.headers.get("access-control-allow-origin") !== origin) {
            throw new Error("live_cor_comparisons_cors_header_missing");
          }
          console.log(JSON.stringify({
            diagnostic: "cor_comparison_response",
            httpStatus: comparisonResponse.status,
            contractVersion: comparisonBody.contractVersion ?? null,
            requestIdMatches: comparisonBody.requestId === "pages-live-comparison-smoke",
            resultKeys: comparisonBody.result && typeof comparisonBody.result === "object"
              ? Object.keys(comparisonBody.result) : [],
            source: comparisonBody.result?.source ?? null,
            demoOnly: comparisonBody.result?.demoOnly ?? null,
            comparisonProductCount: Array.isArray(comparisonBody.result?.comparison?.productIds)
              ? comparisonBody.result.comparison.productIds.length : null,
            error: comparisonBody.error ?? null
          }));
          if (!comparisonResponse.ok || comparisonBody.contractVersion !== "1.0.0" ||
              comparisonBody.requestId !== "pages-live-comparison-smoke" ||
              comparisonBody.result?.source !== "cor_canonical_engine" ||
              comparisonBody.result?.demoOnly !== true ||
              !Array.isArray(comparisonBody.result?.comparison?.productIds) ||
              comparisonBody.result.comparison.productIds.length !== 2 ||
              comparisonBody.result.comparison.productIds.some((id) => !feedIds.has(id))) {
            throw new Error("live_cor_comparisons_failed: HTTP " + comparisonResponse.status + " / " + (comparisonBody.error ?? "invalid_response"));
          }

          const handoffProduct = feed.products[0];
          const handoffResponse = await fetch(new URL("/shopper/v1/handoffs", base), {
            method: "POST",
            headers: {
              Origin: origin,
              Authorization: "Bearer " + sessionBody.credential,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              contractVersion: "1.0.0",
              requestId: "pages-live-handoff-smoke",
              sessionId: "noor-demo-smoke",
              productId: handoffProduct.id,
              destinationType: "product_detail"
            }),
            signal: AbortSignal.timeout(90000)
          });
          const handoffBody = await handoffResponse.json().catch(() => ({}));
          if (handoffResponse.headers.get("access-control-allow-origin") !== origin) {
            throw new Error("live_cor_handoffs_cors_header_missing");
          }
          const handoffUrl = handoffBody.result?.handoff?.destination;
          let handoffUrlIsApprovedHttps = false;
          try {
            const parsedHandoffUrl = new URL(handoffUrl);
            handoffUrlIsApprovedHttps = parsedHandoffUrl.protocol === "https:";
          } catch {
            handoffUrlIsApprovedHttps = false;
          }
          console.log(JSON.stringify({
            diagnostic: "cor_handoff_response",
            httpStatus: handoffResponse.status,
            contractVersion: handoffBody.contractVersion ?? null,
            requestIdMatches: handoffBody.requestId === "pages-live-handoff-smoke",
            source: handoffBody.result?.source ?? null,
            demoOnly: handoffBody.result?.demoOnly ?? null,
            handoffReturned: Boolean(handoffBody.result?.handoff),
            destinationUrlIsHttps: handoffUrlIsApprovedHttps,
            error: handoffBody.error ?? null
          }));
          if (!handoffResponse.ok || handoffBody.contractVersion !== "1.0.0" ||
              handoffBody.requestId !== "pages-live-handoff-smoke" ||
              handoffBody.result?.source !== "cor_canonical_engine" ||
              handoffBody.result?.demoOnly !== true ||
              !handoffBody.result?.handoff || !handoffUrlIsApprovedHttps) {
            throw new Error("live_cor_handoffs_failed: HTTP " + handoffResponse.status + " / " + (handoffBody.error ?? "invalid_response"));
          }

          console.log(JSON.stringify({
            status: "verified",
            session: "issued",
            recommendationsApi: "http_200",
            recommendationCount: recommendationBody.result.recommendations.length,
            recommendationIdsMatchFeed: true,
            comparisonsApi: "http_200",
            comparisonProductCount: comparisonBody.result.comparison.productIds.length,
            handoffsApi: "http_200",
            handoffDestinationType: "product_detail",
            handoffDestinationUrlIsHttps: true
          }, null, 2));
          NODE

      - name: Install dependencies and Chromium + WebKit
        timeout-minutes: 12
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 10000
        run: |
          set -euo pipefail
          npm pkg set dependencies.digital-sales-core="file:./digital-sales-core"
          npm install --package-lock=false --no-audit --no-fund
          # GitHub-hosted Ubuntu runners already include most browser system libraries.
          # Download the engines without apt-based --with-deps, which stalled before
          # the real-browser checks could run. If a missing library is reported,
          # install only that package in a targeted follow-up.
          npx playwright install chromium webkit
      - name: Verify live COR Shopper in a real Chromium browser
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          COR_SHOPPER_BASE_URL: https://digital-sales-core.onrender.com
        run: node scripts/verify-browser-cor-shopper.mjs

      - name: Install WebKit system dependencies
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # Keep this separate from Chromium verification so missing WebKit libraries
          # cannot prevent the primary browser smoke test from running.
          npx playwright install-deps webkit

      - name: Verify live COR Shopper in WebKit (Safari engine)
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          COR_SHOPPER_BASE_URL: https://digital-sales-core.onrender.com
          NOOR_BROWSER_ENGINE: webkit
        run: node scripts/verify-browser-cor-shopper.mjs
